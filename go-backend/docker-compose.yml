version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      API_KEY: "${API_KEY:-apitest}"
      COUPON_DIR: "/app/data"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - coupon-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  coupon-data:
